<!DOCTYPE html>
<html>
  <head>
    <style>
      .subscribe-button {
        background-color: rgb(200, 0, 0);
        color: white;
        border: none;
        border-radius: 2px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-right: 10px;
        padding-left: 10px;
        cursor: pointer;
        margin-right: 8px;
        transition: opacity 0.25s;
        vertical-align: top;
      }

      .subscribe-button:hover {

        opacity: 0.6;
      }

      .subscribe-button:active {
        background-color: rgb(4, 94, 20);
        opacity: 0.8;
      }

      .join-button {
        background-color: white;
        border-color: rgb(42, 105, 243);
        border-style: solid;
        border-width: 1px;
        color: rgb(42, 105, 243);
        padding-top: 9px;
        padding-bottom: 9px;
        padding-right: 10px;
        padding-left: 10px;
        border-radius: 2px;
        cursor: pointer;
        margin-right: 8px;
        transition: background-color 0.15s,
          color 0.15s;
        vertical-align: top;
      }

      .join-button:hover {
        background-color: rgb(42, 105, 243);
        color: white;
        opacity: 1;
      }

      .join-button:active {
        background-color: green;
        opacity: 0.8;
      }

      .tweet-button {
        color: white;
        background-color: rgb(19, 147, 226);
        border: none;
        border-radius: 20px;
        padding-top: 9px;
        padding-bottom: 9px;
        padding-right: 10px;
        padding-left: 10px;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        transition: box-shadow 0.15s;
        vertical-align: top;
      }

      .tweet-button:hover {
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);
      }
    </style>
  </head>
  <body>
    <button class="subscribe-button">
      SUBSCRIBE
    </button>

    <button class="join-button">
      JOIN
    </button>

    <button class="tweet-button">
      Tweet
    </button>
  </body>
</html>
